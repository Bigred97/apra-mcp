name: refresh-seed-urls

# Daily scrape of every APRA landing page in apra-mcp's curated set.
# - When the scraped URLs differ from data/seed_urls.json, commits the
#   refresh directly to main (low-risk auto-data; the seed file is just
#   the latest APRA download URLs, generated content).
# - When any URL returns non-2xx, the run fails (alerts via the workflow's
#   normal failure email).
# Effect: even users on a months-old pip install stay current for weeks
# because new wheels carry the refreshed seed.
#
# 2026-05-27: switched from peter-evans/create-pull-request to a direct
# push because the repo's "Actions cannot create PRs" setting (Path-A
# private repo default) blocked the PR step every day, flooding the
# notification inbox without ever updating the seed.

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC daily (post-APRA-publication window)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev && uv pip install -e .

      - name: Run scraper for every curated dataset
        id: scrape
        run: |
          uv run python scripts/refresh_seed.py > seed_diff.txt 2>&1 || echo "scrape_failed=true" >> $GITHUB_OUTPUT
          cat seed_diff.txt

      - name: Commit seed refresh directly to main
        if: steps.scrape.outputs.scrape_failed != 'true'
        run: |
          if git diff --quiet -- src/apra_mcp/data/seed_urls.json; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apra_mcp/data/seed_urls.json
          git commit -m "chore(seed): refresh URLs from APRA landing pages [skip ci]"
          git push origin HEAD:main
